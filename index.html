function renderChat() {
  const L = state.live;
  const chat = $('#chat');
  if (!chat) return;
  chat.innerHTML = `<div class="flex justify-center my-1"><span class="text-[11px] text-[#8696A0] bg-wa-in rounded-md px-2 py-1">HOY</span></div>
    ${L.chat.map(renderMessage).join('')}

  L.chat.forEach((m) => { m.fresh = false; });
  chat.scrollTop = chat.scrollHeight;
  $('#wa-status').textContent = L.typing ? 'escribiendo…' : 'en línea';
  $('#wa-status').className = `text-[12px] leading-tight ${L.typing ? 'text-wa-green' : 'text-[#8696A0]'}`;
  syncComposer();
}

const ticks = '<svg class="w-4 h-3 inline text-[#53BDEB]" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 6.5l3 3L10 3M7 9.5l1 0L15 3"/></svg>';

function bubble(m, inner, extra = '', footer = '') {
  const out = m.from === 'user';
  const body = `<div class="relative max-w-[82%] rounded-lg ${out ? 'rounded-tr-none bg-wa-out' : 'rounded-tl-none bg-wa-in'} px-2.5 pt-1.5 pb-1 text-[14px] leading-snug text-[#E9EDEF] shadow ${extra}">
      ${inner}
      <div class="flex justify-end items-center gap-1 text-[10.5px] text-white/50 mt-0.5">${m.time}${out ? ticks : ''}</div>
    </div>`;
  const wrapped = footer ? `<div class="reply-stack">${body}${footer}</div>` : body;
  return `<div class="flex ${out ? 'justify-end' : 'justify-start'} ${m.fresh ? 'msg-in' : ''}">${wrapped}</div>`;
}

function receiptSvg(spec) {
  const W = 236;
  const PAD = 14;
  const parts = [];
  let y = 0;
  const t = (x, s, o = {}) => parts.push(`<text x="${x}" y="${y}" font-family="${RECEIPT_MONO}" font-size="${o.size || 9.5}" font-weight="${o.bold ? 700 : 400}" fill="${o.fill || '#1d1d1d'}" text-anchor="${o.anchor || 'start'}"${o.italic ? ' font-style="italic"' : ''}>${esc(s)}</text>`);
  const center = (s, o = {}) => t(W / 2, s, { ...o, anchor: 'middle' });
  const row = (l, r, o = {}) => { t(PAD, l, o); if (r) t(W - PAD, r, { ...o, anchor: 'end' }); };
  const rule = (dashed = true) => parts.push(`<line x1="${PAD}" x2="${W - PAD}" y1="${y}" y2="${y}" stroke="#4a4a4a" stroke-width="0.7"${dashed ? ' stroke-dasharray="3 2"' : ''}/>`);

  y = 10;
  parts.push(spec.logo(W, y));
  y += spec.logoH;
  spec.header.forEach((h, i) => { y += 11.5; center(h, { size: i === 0 && spec.tagline ? 8.5 : 9, italic: i === 0 && spec.tagline }); });
  y += 8; rule();
  spec.items.forEach((it) => {
    y += 13; row(it.name, it.price);
    if (it.detail) { y += 10.5; t(PAD + 10, it.detail, { size: 8.5, fill: '#5a5a5a' }); }
  });
  y += 8; rule();
  y += 14; row('SUBTOTAL', spec.subtotal);
  y += 12.5; row(spec.taxLabel, spec.tax);
  y += 17; row('TOTAL', spec.total, { bold: true, size: 12.5 });
  y += 9; rule(false);
  spec.payment.forEach(([l, r]) => { y += 12.5; row(l, r); });
  y += 14; center(spec.approved, { bold: true });
  y += 9;
  let x = PAD + 22;
  for (let i = 0; x < W - PAD - 22; i += 1) {
    const w = [1, 1.8, 2.6, 1.2, 3.2][(i * 7) % 5];
    parts.push(`<rect x="${x.toFixed(1)}" y="${y}" width="${w}" height="26" fill="#141414"/>`);
    x += w + [1.1, 2.1, 1.5][(i * 5) % 3];
  }
  y += 37; center(spec.barcodeText, { size: 8 });
  spec.footer.forEach((f) => { y += 11.5; center(f, { size: 8.5 }); });
  const H = y + 16;
  let edge = `M0,0 H${W} V${H - 6}`;
  for (let ex = W; ex > 0; ex -= 8) edge += ` L${ex - 4},${H} L${ex - 8},${H - 6}`;
  edge += ' Z';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Recibo ${esc(spec.store)}">
    <defs><linearGradient id="paper-${spec.id}" x1="0" x2="1" y1="0" y2="0.15">
      <stop offset="0" stop-color="#EEEBE2"/><stop offset=".45" stop-color="#FCFBF7"/><stop offset="1" stop-color="#ECE9DF"/></linearGradient></defs>
    <path d="${edge}" fill="url(#paper-${spec.id})"/>${parts.join('')}</svg>`;
}

/* ------------------------------------------------------------------ *
 * Scenario engine
 * ------------------------------------------------------------------ */
class Aborted extends Error {}

const md = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

function freshLive() {
  return {
    running: null,
    done: Object.fromEntries(Object.keys(SCENARIO_META).map((k) => [k, false])),
    chat: [],
    typing: false,
    composer: '',
    gl: GL_SEED(),
    resolved: [],
    clock: 9 * 60 + 41,
  };
}

function makeCtx(token) {
  const L = () => state.live;
  const guard = () => { if (token !== state.runToken || state.view !== 'live') throw new Aborted(); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms)).then(guard);
  const push = (msg) => {
    const m = { id: uid('m'), time: clockStr(), fresh: true, ...msg };
    L().chat.push(m);
    renderChat();
    return m;
  };
  const row = (id) => L().gl.find((r) => r.id === id);
  const refresh = () => { renderGL(); renderKpis(); renderInbox(); };
  return {
    wait,
    tick: (min = 1) => { L().clock += min; },
    async agent(msg, typingMs = 1500) {
      L().typing = true; renderChat();
      await wait(typingMs);
      L().typing = false;
      return push({ from: 'agent', type: 'text', ...(typeof msg === 'string' ? { text: msg } : msg) });
    },
    async userTypes(text, cps = 40) {
      for (let i = 1; i <= text.length; i += 2) {
        L().composer = text.slice(0, i);
        renderChat();
        await wait((1000 / cps) * 2);
      }
      L().composer = '';
      await wait(250);
      return push({ from: 'user', type: 'text', text: esc(text) });
    },
    user: (msg) => push({ from: 'user', type: 'text', ...msg }),
    update(m, patch) { Object.assign(m, patch); renderChat(); },
    insertRow(r) { L().gl.unshift({ when: 'Hoy · ' + clockStr(), state: 'normal', ...r, flash: true }); refresh(); },
    updateRow(id, patch) { Object.assign(row(id), patch, { flash: true }); refresh(); },
    async removeRow(id) {
      row(id).leaving = true;
      renderGL();
      await wait(550);
      L().gl = L().gl.filter((r) => r.id !== id);
      refresh();
    },
    resolved(title, reason, amount) { L().resolved.unshift({ title, reason, amount }); renderInbox(); },
    toast,
  };
}

async function runScenario(key) {
  const L = state.live;
  if (!state.onboarding.done || L.running || L.done[key]) return;
  L.running = key;
  renderSimulator();
  const token = state.runToken;
  try {
    await SCENARIOS[key](makeCtx(token));
    if (token === state.runToken) L.done[key] = true;
  } catch (err) {
    if (!(err instanceof Aborted)) console.error(err);
  } finally {
    if (token === state.runToken) { L.running = null; L.typing = false; L.composer = ''; renderSimulator(); renderChat(); }
  }
}

function usdCents(cents) {
  const sign = cents < 0 ? '-' : '';
  const abs = Math.abs(cents);
  const dollars = Math.floor(abs / 100);
  const rem = String(abs % 100).padStart(2, '0');
  const grouped = String(dollars).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return `${sign}$${grouped}.${rem}`;
}
const usd = (n) => usdCents(Math.round(Number(n) * 100));
const mask4 = (last4) => `••••${last4}`;

function depositRows(total) {
  const cents = Math.round(Number(total) * 100);
  if (cents === CANON_BANKS_CENTS) {
    return [
      { name: 'Chase Checking', mask: '4821', cents: CHECKING_CENTS },
      { name: 'Chase Savings', mask: '7730', cents: SAVINGS_CENTS },
    ];
  }
  const save = Math.min(SAVINGS_CENTS, Math.max(0, cents));
  const check = cents - save;
  const rows = [];
  if (check > 0 || cents === 0) rows.push({ name: 'Chase Checking', mask: '4821', cents: Math.max(0, check) });
  if (save > 0) rows.push({ name: 'Chase Savings', mask: '7730', cents: save });
  return rows;
}

function parseMoney(raw) {
  const t = String(raw).trim().replace(/\s/g, '').replace(/^\$/, '').replace(/,/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
  const n = Math.round(parseFloat(t) * 100) / 100;
  if (!Number.isFinite(n) || n > 100000000) return null;
  return n;
}

function cleanName(raw) {
  const name = String(raw).replace(/[<>*]/g, '').replace(/\s+/g, ' ').trim();
  if (name.length < 2 || name.length > 60) return null;
  return name;
}

function cleanDate(raw) {
  const s = String(raw).replace(/[<>*]/g, '').replace(/\s+/g, ' ').trim();
  if (s.length < 4 || s.length > 40) return null;
  return s;
}

}

function syncComposer() {
  const input = $('#composer-input');
  const display = $('#composer');
  const send = $('#composer-send');
  if (!input || !display || !send) return;
  const L = state.live;
  const typingText = Boolean(state.reply && (state.reply.kind === 'text' || state.reply.kind === 'either'));
  input.classList.toggle('is-hidden', !typingText);
  if (typingText) {
    input.placeholder = state.reply.placeholder || 'Escribe';
    input.maxLength = state.reply.max || 80;
    input.inputMode = state.reply.inputMode || 'text';
    send.dataset.action = 'send';
    send.setAttribute('aria-label', 'Enviar');
    send.innerHTML = icon('send', 'w-5 h-5');
    if (state.reply.focus) {
      state.reply.focus = false;
      input.value = '';
      input.focus();
    }
  } else {
    send.removeAttribute('data-action');
    send.setAttribute('aria-label', 'Micrófono');
    send.innerHTML = icon('mic', 'w-5 h-5');
    let hint = 'Mensaje';
    if (L && L.composer) hint = L.composer;
    else if (state.reply && state.reply.kind === 'plaid') hint = 'Abre el enlace';
    else if (state.reply && state.reply.kind === 'buttons') hint = 'Elige un botón';
    display.textContent = hint;
  }
  display.className = `flex-1 truncate ${typingText ? 'is-hidden' : ''} ${L && L.composer && !typingText ? 'text-white' : 'text-[#8696A0]'}`;
}

function pushUser(text) {
  state.live.chat.push({
    id: uid('m'), from: 'user', type: 'text', time: clockStr(), fresh: true, text: esc(text),
  });
}

function armReply(token, kind, extra) {
  return new Promise((resolve, reject) => {
    if (token !== state.runToken) {
      reject(new Aborted());
      return;
    }
    state.reply = { token, kind, focus: true, ...extra, resolve, reject };
    renderChat();
  });
}

function chooseReply(el) {
  const r = state.reply;
  if (!r || (r.kind !== 'buttons' && r.kind !== 'either')) return;
  if (r.token !== state.runToken || el.dataset.msg !== r.msgId) return;
  const msg = state.live.chat.find((m) => m.id === r.msgId);
  if (msg) msg.answered = true;
  pushUser(el.dataset.label || '');
  state.reply = null;
  renderChat();
  r.resolve({ type: 'button', id: el.dataset.value });
}

function submitComposer() {
  const r = state.reply;
  if (!r || (r.kind !== 'text' && r.kind !== 'either')) return;
  if (r.token !== state.runToken) return;
  const input = $('#composer-input');
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  if (r.kind === 'either') {
    const msg = state.live.chat.find((m) => m.id === r.msgId);
    if (msg) msg.answered = true;
  }
  pushUser(text);
  state.reply = null;
  renderChat();
  r.resolve({ type: 'text', text });
}

function openPlaid() {
  const r = state.reply;
  if (!r || r.kind !== 'plaid' || r.token !== state.runToken) return;
  state.plaid = { open: true, phase: 'pick' };
  renderPlaid();
}

function closePlaid() {
  if (!state.plaid.open) return;
  if (state.plaid.phase === 'done') {
    finishPlaid();
    return;
  }
  state.plaid.open = false;
  renderPlaid();
}

function continuePlaid() {
  if (!state.plaid.open) return;
  state.plaid.phase = 'done';
  renderPlaid();
}

function finishPlaid() {
  const r = state.reply;
  state.plaid = { open: false, phase: 'pick' };
  renderPlaid();
  if (!r || r.kind !== 'plaid' || r.token !== state.runToken) return;
  state.reply = null;
  renderChat();
  r.resolve({ type: 'plaid' });
}

function renderPlaid() {
  const host = $('#plaid-sheet');
  if (!host) return;
  const p = state.plaid;
  if (!p || !p.open) {
    host.hidden = true;
    host.innerHTML = '';
    return;
  }
  host.hidden = false;
  const biz = esc(state.account.business || 'tu negocio');
  const rows = p.phase === 'done'
    ? `${depositRows(state.onboarding.banksTotal).map((r) =>
      `<div class="plaid-row"><span>${esc(r.name)}</span><span class="plaid-mask">${mask4(r.mask)}</span><span class="plaid-amt">${usdCents(r.cents)}</span></div>`
    ).join('')}<div class="plaid-row"><span>Amex Business</span><span class="plaid-mask">${mask4('1009')}</span><span class="plaid-amt">Tarjeta</span></div>`
    : `<div class="plaid-row"><span>Chase</span><span class="plaid-amt">Banco</span></div>
       <div class="plaid-row"><span>American Express</span><span class="plaid-amt">Tarjeta</span></div>`;
  const action = p.phase === 'done'
    ? '<button type="button" class="plaid-go" data-action="plaid-return">Volver a WhatsApp</button>'
    : '<button type="button" class="plaid-go" data-action="plaid-continue">Continuar</button>';
  const title = p.phase === 'done' ? 'Cuentas conectadas' : 'Conectar cuentas';
  const fine = p.phase === 'done'
    ? 'Estos son los últimos 4 dígitos. El número completo no se muestra.'
    : 'Al continuar no pedimos el número completo.';
  host.innerHTML = `
    <div class="plaid-urlbar"><span>link.serbell.app/plaid</span><button type="button" class="plaid-x" data-action="plaid-close">Cerrar</button></div>
    <div class="plaid-body">
      <p class="plaid-brand">Plaid</p>
      <h2 class="plaid-h">${title}</h2>
      <p class="plaid-p">Solo lectura para ${biz}. Serbell no transfiere ni paga.</p>
      <div class="plaid-list">${rows}</div>
      <p class="plaid-fine">${fine}</p>
      ${action}
    </div>`;
}

function periodBooks(choice) {
  return choice === 'pasado' ? BOOKS.y2025 : BOOKS.ytd;
}

function periodPhrase(ob) {
  if (ob.dateChoice === 'este') return 'del 1 ene 2026 a hoy';
  if (ob.dateChoice === 'pasado') return 'en 2025';
  return `desde ${esc(ob.customDate)}`;
}

function verifyPrompt(step, amount, ob) {
  if (step === 'bancos') return `El saldo de bancos hoy es **${usd(amount)}**.\n\n¿Está bien?`;
  const where = ob.source === 'qbo' ? 'QuickBooks' : 'tu archivo';
  const noun = step === 'ingresos' ? 'los ingresos' : 'los gastos';
  return `En ${where}, ${periodPhrase(ob)}, ${noun} suman **${usd(amount)}**.\n\n¿Está bien?`;
}

function banksMessage(total) {
  const lines = depositRows(total).map((r) => `• ${r.name} ${mask4(r.mask)} · ${usdCents(r.cents)}`);
  lines.push(`• Amex Business ${mask4('1009')} · tarjeta`);
  return `Listo. Bancos conectados, solo lectura:\n${lines.join('\n')}\n\nNo muestro el número completo de ninguna cuenta.`;
}

function analysisMessage(ob) {
  const zero = ob.source === 'zero';
  const efectivo = ob.banksTotal;
  const ar = zero ? 0 : BOOKS.ar;
  const ap = zero ? 0 : BOOKS.ap;
  const biz = esc(state.account.business);
  const head = zero ? `Así empieza **${biz}**:` : `Así veo a **${biz}** hoy:`;
  let rec;
  if (zero) {
    rec = 'El efectivo es lo que Plaid lee hoy en Chase. Por cobrar y por pagar están en cero. Cuando cierres un trabajo, pídeme la factura por aquí. Serbell no cobra ni paga.';
  } else if (efectivo >= BOOKS.siteone) {
    rec = `Esta semana vence SiteOne (${usd(BOOKS.siteone)}). Te recomiendo cobrar la instalación de Oak Street (${usd(BOOKS.oak)}) antes de pagar esa factura. El pago lo haces tú en tu banco: yo no muevo dinero.`;
  } else {
    rec = `Con ${usd(efectivo)} en efectivo no alcanza para SiteOne (${usd(BOOKS.siteone)}) sin usar lo por cobrar. Te recomiendo cobrar Oak Street (${usd(BOOKS.oak)}) primero. Yo no muevo dinero: el pago lo haces tú en el banco.`;
  }
  return `${head}\n\nEfectivo **${usd(efectivo)}**\nPor cobrar **${usd(ar)}**\nPor pagar **${usd(ap)}**\n\n${rec}`;
}

async function say(c, msg) {
  if (state._said) c.tick(1);
  state._said = true;
  const payload = typeof msg === 'string'
    ? { text: formatBot(msg) }
    : { ...msg, text: formatBot(msg.text) };
  return c.agent(payload, 650);
}

async function askMoney(c, token, prompt) {
  let question = prompt;
  for (;;) {
    const m = await say(c, question);
    const got = await armReply(token, 'text', { msgId: m.id, placeholder: 'Monto, ej. 97240', max: 16, inputMode: 'decimal' });
    const n = parseMoney(got.text);
    if (n !== null) return n;
    question = 'No pude leer ese monto. Escríbelo como 97240 o $97,240.00.';
  }
}

async function playOnboarding(c, token) {
  const ob = state.onboarding;
  await armReply(token, 'text', { placeholder: 'Mensaje', max: 240 });
  state.account.name = 'Cristiano Bebe';
  let namePrompt = `Soy Serbell.\n\nTu WhatsApp ya trae el teléfono ${WA_PHONE}, así que no te lo pido.\n\n¿Cómo se llama tu negocio?`;
  let business = null;
  while (business === null) {
    const m = await say(c, namePrompt);
    const got = await armReply(token, 'text', { msgId: m.id, placeholder: 'Nombre del negocio', max: 60 });
    business = cleanName(got.text);
    if (business === null) namePrompt = 'No alcancé a leer el nombre. ¿Cómo se llama tu negocio?';
  }
  state.account.business = business;

  let emailPrompt = `¿Cuál es el correo de ${esc(business)}? Es opcional.`;
  let email;
  for (;;) {
    const m = await say(c, {
      type: 'replies',
      text: emailPrompt,
      buttons: [{ id: 'skip', label: 'Omitir' }],
    });
    const got = await armReply(token, 'either', { msgId: m.id, placeholder: 'Correo (opcional)', max: 80 });
    if (got.type === 'button') { email = ''; break; }
    const candidate = got.text.trim();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(candidate) && candidate.length <= 80 && !/[<>*]/.test(candidate)) {
      email = candidate;
      break;
    }
    emailPrompt = 'Ese correo no se ve bien. Escríbelo de nuevo o pulsa Omitir.';
  }
  state.account.email = email;
  if (email) await say(c, `Guardé ${esc(email)}.`);

  const srcMsg = await say(c, {
    type: 'replies',
    text: '¿De dónde traemos los números?',
    buttons: [
      { id: 'qbo', label: 'QuickBooks' },
      { id: 'excel', label: 'Excel o ZIP' },
      { id: 'zero', label: 'Empezar de cero' },
    ],
  });
  const src = await armReply(token, 'buttons', { msgId: srcMsg.id });
  ob.source = src.id;

  if (ob.source !== 'zero') {
    const dateMsg = await say(c, {
      type: 'replies',
      text: `¿Desde qué fecha importo ${ob.source === 'qbo' ? 'QuickBooks' : 'el archivo'}?`,
      buttons: [
        { id: 'este', label: 'Este año' },
        { id: 'pasado', label: 'Año pasado' },
        { id: 'otra', label: 'Otra fecha' },
      ],
    });
    const datePick = await armReply(token, 'buttons', { msgId: dateMsg.id });
    ob.dateChoice = datePick.id;
    if (ob.dateChoice === 'otra') {
      let datePrompt = 'Escríbeme la fecha. Por ejemplo: 1 mar 2026.';
      let custom = null;
      while (custom === null) {
        const m = await say(c, datePrompt);
        const got = await armReply(token, 'text', { msgId: m.id, placeholder: 'Fecha, ej. 1 mar 2026', max: 40 });
        custom = cleanDate(got.text);
        if (custom === null) datePrompt = 'No alcancé a leer la fecha. Prueba con algo corto, como 1 mar 2026.';
      }
      ob.customDate = custom;
    }
    const books = periodBooks(ob.dateChoice);
    const fixQ = {
      ingresos: '¿Cuál es el monto correcto de ingresos?',
      gastos: '¿Cuál es el monto correcto de gastos?',
      bancos: '¿Cuál es el monto correcto del saldo de bancos?',
    };
    const ack = { ingresos: 'Ingresos', gastos: 'Gastos', bancos: 'Bancos' };
    for (const step of ['ingresos', 'gastos', 'bancos']) {
      const q = await say(c, { type: 'replies', text: verifyPrompt(step, books[step], ob), buttons: CONFIRM_BTNS });
      const pick = await armReply(token, 'buttons', { msgId: q.id });
      let amount = books[step];
      if (pick.id === 'fix') {
        amount = await askMoney(c, token, fixQ[step]);
        await say(c, `Anotado. ${ack[step]}: **${usd(amount)}**.`);
      }
      ob.confirmed[step] = amount;
    }
    ob.banksTotal = ob.confirmed.bancos;
  }

  const plaidText = ob.source === 'zero'
    ? 'Empezamos de cero, sin historial. Conecta tus bancos con Plaid. El enlace se abre fuera del chat.\n\nSolo lectura: no hago transferencias ni pagos.'
    : 'Números anotados. Conecta tus bancos con Plaid. El enlace se abre fuera del chat.\n\nSolo lectura: no hago transferencias ni pagos.';
  const card = await say(c, { type: 'plaid', text: plaidText });
  await armReply(token, 'plaid', { msgId: card.id });
  await say(c, banksMessage(ob.banksTotal));
  await say(c, analysisMessage(ob));
  await say(c, `Ya quedó el alta de ${esc(state.account.business)}. A la izquierda tienes los 11 escenarios: recibos, notas de voz, facturas y alertas.`);
}

async function runOnboarding() {
  const token = state.runToken;
  if (!state.live) return;
  state.live.running = 'onboarding';
  renderSimulator();
  try {
    await playOnboarding(makeCtx(token), token);
    if (token !== state.runToken) return;
    state.onboarding.done = true;
  } catch (err) {
    if (!(err instanceof Aborted)) console.error(err);
  } finally {
    if (token === state.runToken) {
      state.live.running = null;
      state.live.typing = false;
      state.live.composer = '';
      renderSimulator();
      renderEvent();
      renderChat();
    }
  }
}

function resetLive() {
  const prev = state.reply;
  state.reply = null;
  state.runToken += 1;
  if (prev) prev.reject(new Aborted());
  state._said = false;
  state.account = { name: '', business: '', email: '' };
  state.onboarding = { done: false, source: null, dateChoice: null, customDate: '', confirmed: {}, banksTotal: 24620.15 };
  state.plaid = { open: false, phase: 'pick' };
  state.live = freshLive();
  state.live.event = null;
}

const ACTIONS = {
  scenario: (el) => runScenario(el.dataset.id),
  reset: () => { resetLive(); render(); runOnboarding(); },
  reply: (el) => chooseReply(el),
  send: () => submitComposer(),
  'open-plaid': () => openPlaid(),
  'plaid-close': () => closePlaid(),
  'plaid-continue': () => continuePlaid(),
  'plaid-return': () => finishPlaid(),
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  ACTIONS[el.dataset.action]?.(el);
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.target.id !== 'composer-input') return;
  e.preventDefault();
  submitComposer();
});

resetLive();
render();
runOnboarding();

</script>
</body>
</html>
